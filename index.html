<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Will You Be My Valentine?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #ffdde1, #ee9ca7);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 2.5rem 2rem;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.15);
      max-width: 420px;
      width: 90%;
      position: relative;
    }

    h1 {
      font-size: 2rem;
      color: #d7263d;
      margin-bottom: 0.75rem;
    }

    p {
      color: #444;
      margin-bottom: 1.5rem;
    }

    .hearts {
      position: absolute;
      inset: -40px;
      pointer-events: none;
      z-index: -1;
    }

    .heart {
      position: absolute;
      width: 18px;
      height: 18px;
      background: #ff4b5c;
      transform: rotate(45deg);
      animation: float 6s linear infinite;
      opacity: 0.5;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      background: #ff4b5c;
      border-radius: 50%;
    }

    .heart::before {
      top: -9px;
      left: 0;
    }

    .heart::after {
      left: -9px;
      top: 0;
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(45deg);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-180px) rotate(45deg);
        opacity: 0;
      }
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    button {
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    #yesBtn {
      background: #ff4b5c;
      color: #fff;
      box-shadow: 0 8px 18px rgba(215, 38, 61, 0.4);
    }

    #yesBtn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 24px rgba(215, 38, 61, 0.5);
    }

    #noBtn {
      background: #f1f1f1;
      color: #555;
    }

    #noBtn:hover {
      background: #e4e4e4;
    }

    #message {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      color: #d7263d;
      min-height: 1.2em;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.6rem;
      }
      .container {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hearts" id="hearts"></div>

    <h1>Will you be my Valentine?</h1>
    <p>
      I’m really glad you’re in my life.<br />
      So… will you say yes and make this Valentine’s Day unforgettable?
    </p>

    <div class="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 😅</button>
    </div>

    <div id="message"></div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const msg = document.getElementById("message");
    const hearts = document.getElementById("hearts");

    function createHeart() {
      const h = document.createElement("div");
      h.className = "heart";
      h.style.left = Math.random() * 100 + "%";
      h.style.bottom = "-40px";
      h.style.animationDuration = 4 + Math.random() * 3 + "s";
      hearts.appendChild(h);
      setTimeout(() => h.remove(), 7000);
    }
    setInterval(createHeart, 700);

    let noClickCount = 0;
    noBtn.addEventListener("mouseover", () => {
      noClickCount++;
      const offset = 40 + noClickCount * 5;
      const x = (Math.random() - 0.5) * offset;
      const y = (Math.random() - 0.5) * offset;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    yesBtn.addEventListener("click", () => {
      msg.textContent = "I knew you’d say yes! ❤️ Can’t wait to celebrate with you.";
      yesBtn.disabled = true;
      noBtn.disabled = true;
      yesBtn.style.opacity = "0.8";
      noBtn.style.opacity = "0.3";
    });

    noBtn.addEventListener("click", () => {
      msg.textContent = "Ouch! Try that Yes button instead 😜";
    });
  </script>
</body>
</html>
